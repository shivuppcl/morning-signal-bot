name: Rule1 Cross Alerts
on:
  workflow_dispatch: {}
concurrency:
  group: rule1
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python rule1_bot.py
      - name: Persist alerted state
        run: |
          git config user.name "rule1-bot"
          git config user.email "rule1@bot"
          git pull --rebase -q || true
          git add rule1_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "rule1 state $(date -u +%H:%M)"
          git push || true
